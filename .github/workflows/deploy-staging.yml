name: Deploy Studio staging
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact independently accepted application SHA
        required: true
        type: string
      phase:
        description: Release or hosted acceptance
        required: true
        type: choice
        options: [release, acceptance]
      quiesced:
        description: Staging writes and mock processing are quiesced
        required: true
        default: false
        type: boolean
  push:
    branches: [ops/nm-ai-deploy-01]
    paths: ['.github/staging-deploy.request']
permissions:
  contents: read
  actions: read
concurrency:
  group: nepmui-ai-studio-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'haonguyen97ftu/nepmui-ai-studio' && github.ref == 'refs/heads/ops/nm-ai-deploy-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: nepmui-staging
      url: https://nepmui-ai-studio-staging.haonguyen-drew.workers.dev
    env:
      OPS_DIR: ${{ github.workspace }}/release-ops
      APP_DIR: ${{ github.workspace }}/candidate
      CLOUDFLARE_ACCOUNT_ID: 3bdb3fba2669802b6102e0f1953294fe
      STUDIO_STAGING_D1_ID: 71103118-e36b-4b55-a64d-a8f1d7974903
      STUDIO_D1_ID: ${{ vars.STUDIO_PRODUCTION_D1_ID }}
      STUDIO_BENCHMARK_URL: https://nepmui-ai-studio-staging.haonguyen-drew.workers.dev
      STUDIO_MESSENGER_INGEST: 'false'
      STUDIO_MESSENGER_OUTBOUND: 'false'
      STAGING_APPROVED_CANDIDATE_SHA: ${{ vars.STAGING_APPROVED_CANDIDATE_SHA }}
      REQUESTED_CANDIDATE: ${{ inputs.candidate }}
      REQUESTED_PHASE: ${{ inputs.phase }}
      REQUESTED_QUIESCED: ${{ inputs.quiesced }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: release-ops
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Verify release approval and exact Studio CI
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$OPS_DIR/ops/staging-release.mjs" check
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.gate.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Verify checkout and install locked dependencies
        working-directory: candidate
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm ci
      - name: Build and verify the staging bundle
        if: steps.gate.outputs.phase == 'release'
        working-directory: candidate
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.candidate }}
        run: |
          set -euo pipefail
          node -e 'require("node:fs").writeFileSync("public/studio-release.json", JSON.stringify({sha: process.env.EXPECTED_SHA}), {flag:"wx"})'
          npm run build:staging
          node "$OPS_DIR/ops/staging-hosted.mjs" build
      - name: Prepare protected runtime bindings
        if: steps.gate.outputs.phase == 'release'
        env:
          ADMIN_SECRET: ${{ secrets.STAGING_ADMIN_SECRET }}
          AUTH_PEPPER: ${{ secrets.STAGING_AUTH_PEPPER }}
          CHANNEL_ENCRYPTION_KEY: ${{ secrets.STAGING_CHANNEL_ENCRYPTION_KEY }}
          STAGING_RECOVERY_KEY: ${{ secrets.STAGING_RECOVERY_KEY }}
        run: node "$OPS_DIR/ops/staging-hosted.mjs" secrets
      - name: Verify the staging recovery point
        if: steps.gate.outputs.phase == 'release'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_RECOVERY_KEY: ${{ secrets.STAGING_RECOVERY_KEY }}
        run: node "$OPS_DIR/ops/staging-release.mjs" backup
      - name: Persist encrypted staging recovery evidence
        id: recovery
        if: steps.gate.outputs.phase == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-staging-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/studio-recovery/recovery.aes256gcm
          if-no-files-found: error
          retention-days: 7
      - name: Apply and verify staged D1 migrations
        id: migration
        if: steps.gate.outputs.phase == 'release'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_RECOVERY_KEY: ${{ secrets.STAGING_RECOVERY_KEY }}
          RECOVERY_ARTIFACT_ID: ${{ steps.recovery.outputs.artifact-id }}
        run: node "$OPS_DIR/ops/staging-release.mjs" migrate
      - name: Deploy reviewed staging release
        if: steps.gate.outputs.phase == 'release'
        working-directory: candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STUDIO_PLATFORM_MIGRATION_READY: ${{ steps.migration.outputs.readiness }}
          STUDIO_STAGING_SECRETS_FILE: ${{ runner.temp }}/studio-runtime-secrets.json
        run: |
          set -euo pipefail
          test "$STUDIO_PLATFORM_MIGRATION_READY" = 0005_webhook_replay.sql
          npm run deploy:staging
      - name: Verify the hosted candidate and signed-out gates
        run: node "$OPS_DIR/ops/staging-hosted.mjs" smoke
      - name: Run scoped account acceptance and the 13+2 benchmark
        if: steps.gate.outputs.phase == 'acceptance'
        env:
          STUDIO_BENCHMARK_EMAIL: ${{ secrets.STAGING_BENCHMARK_EMAIL }}
          STUDIO_BENCHMARK_PASSWORD: ${{ secrets.STAGING_BENCHMARK_PASSWORD }}
          STUDIO_BENCHMARK_WORKSPACE: ${{ vars.STAGING_BENCHMARK_WORKSPACE }}
        run: node "$OPS_DIR/ops/staging-hosted.mjs" acceptance
      - name: Remove private runner files
        if: always()
        run: rm -f -- "$RUNNER_TEMP/studio-runtime-secrets.json" "$RUNNER_TEMP/studio-recovery/recovery.aes256gcm"
